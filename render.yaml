services:
  - type: web
    name: inventory-signal
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - Dockerfile
        - build.gradle.kts
        - settings.gradle.kts
        - gradlew
        - gradle/**
        - src/main/**
      ignoredPaths:
        - src/main/resources/products.yaml # editing tracked products/pincodes shouldn't trigger a rebuild
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
