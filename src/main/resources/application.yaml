spring:
  application:
    name: inventory-signal

  config:
    import:
      - optional:file:.env[.properties]
      - optional:classpath:products.yaml

telegram:
  bot-token: ${BOT_TOKEN}
  owner-chat-id: ${OWNER_CHAT_ID}
  polling-timeout-seconds: 30
  api-base-url: https://api.telegram.org

app:
  scheduler:
    initial-delay-ms: 30000
    fixed-delay-ms: 60000
  connector:
    base-interval-minutes: 15
    request-timeout-seconds: 10
    rate-limit-delay-ms: 8000
    max-consecutive-fails: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers
  endpoint:
    health:
      show-details: never
    loggers:
      access: unrestricted

server:
  port: ${PORT:8080}
