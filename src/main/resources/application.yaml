spring:
  application:
    name: inventory-signal

  profiles:
    active: local # local dev default when no profile is set; Render overrides via SPRING_PROFILES_ACTIVE=prod

  config:
    import:
      - optional:file:.env[.properties]
      - optional:classpath:products.yaml

telegram:
  bot-token: ${BOT_TOKEN}
  owner-chat-id: ${OWNER_CHAT_ID}
  api-base-url: https://api.telegram.org

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers
  endpoint:
    health:
      show-details: never
    loggers:
      access: unrestricted

server:
  port: ${PORT:8080}
