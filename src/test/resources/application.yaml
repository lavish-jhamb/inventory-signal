spring:
  config:
    import: optional:classpath:products.yaml

app:
  scheduler:
    initial-delay-ms: 30000
    fixed-delay-ms: 60000
    jitter-max-ms: 0
  connector:
    request-timeout-seconds: 10
    rate-limit-delay-ms: 0
    max-consecutive-fails: 10
    cooldown-minutes: 30
  catalog:
    enabled: false # never hit the network in tests - TrackingCatalogService.refresh() becomes a no-op
    repo-owner: test
    repo-name: test
    branch: main
    path: products.yaml

telegram:
  bot-token: test-token-not-real
  owner-chat-id: 123456789
